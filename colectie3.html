<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonatori | BredApeYuriClub Ecosystem</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #080b11; color: #ffffff; min-height: 100vh; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 6%; background: rgba(12,16,26,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.08); }
        .logo { font-family: 'Montserrat', sans-serif; font-weight: 900; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; font-size: 1.5rem; }
        .container { max-width: 1200px; margin: 40px auto; padding: 20px; }
        .title { font-family: 'Montserrat', sans-serif; font-size: 2.8rem; text-align: center; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin: 30px 0; }
        .stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 12px; text-align: center; }
        .stat-card span { display: block; color: #64748b; font-size: 0.8rem; text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
        .stat-card strong { font-size: 1.3rem; color: #f8fafc; font-family: 'Montserrat'; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 40px; }
        .gallery img { width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.3s; }
        .gallery img:hover { transform: scale(1.05); }
        .btn-opensea { display: block; width: 100%; max-width: 300px; margin: 30px auto; padding: 15px; text-align: center; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; text-decoration: none; border-radius: 10px; font-weight: 700; box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">BredApeYuriClub</a>
        <a href="index.html" style="color: #cbd5e1; text-decoration: none; font-weight: 600;">← Back to Collections</a>
    </nav>
    <main class="container">
        <h1 class="title">Bonatori</h1>
        <div class="stats-grid">
            <div class="stat-card"><span>Floor Price</span><strong>0.0024 ETH</strong></div>
            <div class="stat-card"><span>Total Volume</span><strong>25.19 ETH</strong></div>
            <div class="stat-card"><span>Owners</span><strong>565</strong></div>
            <div class="stat-card"><span>Items</span><strong>5,684</strong></div>
        </div>
        <a href="https://opensea.io/collection/bonatori" target="_blank" class="btn-opensea">View on OpenSea</a>
        <h2 style="font-family: 'Montserrat'; margin-top: 40px; margin-bottom: 20px;">Featured Gallery</h2>
        <div class="gallery">
            <img src="images/bonatori1.png" alt="NFT Showcase 1" onerror="this.src='images/placeholder1.png'">
            <img src="images/bonatori2.png" alt="NFT Showcase 2" onerror="this.src='images/placeholder2.png'">
            <img src="images/bonatori3.png" alt="NFT Showcase 3" onerror="this.src='images/placeholder3.png'">
            <img src="images/bonatori4.png" alt="NFT Showcase 4" onerror="this.src='images/placeholder4.png'">
        </div>
    </main>
</body>
</html>
