<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apes Bunitori Evolution | BredApeYuriClub Ecosystem</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #080b11; color: #ffffff; min-height: 100vh; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 6%; background: rgba(12,16,26,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.08); }
        .logo { font-family: 'Montserrat', sans-serif; font-weight: 900; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; font-size: 1.5rem; }
        .container { max-width: 1200px; margin: 40px auto; padding: 20px; }
        .title { font-family: 'Montserrat', sans-serif; font-size: 2.8rem; text-align: center; margin-bottom: 20px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 30px 0; }
        .stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 15px; border-radius: 12px; text-align: center; }
        .stat-card span { display: block; color: #64748b; font-size: 0.75rem; text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
        .stat-card strong { font-size: 1.1rem; color: #f8fafc; font-family: 'Montserrat'; }
        
        .mint-card { background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; max-width: 650px; margin: 30px auto; }
        .mint-header { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
        .progress-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
        .progress-bar-fill { height: 100%; width: 41%; background: #2563eb; } /* 1,230 din 3,000 adică ~41% */
        
        .stage-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; }
        .stage-info h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
        .price-tag { font-size: 1.1rem; font-weight: 700; color: #ffffff; }
        .usd-price { font-size: 0.85rem; color: #94a3b8; font-weight: 500; margin-right: 6px; }
        .status-tag { display: inline-flex; align-items: center; font-size: 0.75rem; font-weight: 700; color: #10b981; }
        .dot { height: 6px; width: 6px; background-color: #10b981; border-radius: 50%; display: inline-block; margin-right: 4px; }

        .mint-controls { display: flex; align-items: center; gap: 12px; }
        .qty-selector { display: flex; align-items: center; background: #ffffff; color: #0f172a; border-radius: 10px; padding: 4px 8px; font-weight: 700; }
        .qty-btn { background: none; border: none; font-size: 1.2rem; font-weight: 700; color: #64748b; cursor: pointer; padding: 4px 10px; }
        .qty-btn:hover { color: #000; }
        .qty-val { width: 24px; text-align: center; }

        .btn-blue-mint { background: #0084ff; color: #ffffff; border: none; padding: 10px 28px; border-radius: 20px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        .btn-blue-mint:hover { background: #0066cc; }

        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 40px; }
        .gallery img { width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.3s; }
        .gallery img:hover { transform: scale(1.05); }
        #status-msg { text-align: center; margin-top: 15px; font-size: 0.85rem; color: #a855f7; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">BredApeYuriClub</a>
        <a href="index.html" style="color: #cbd5e1; text-decoration: none; font-weight: 600;">← Back to Collections</a>
    </nav>
    <main class="container">
        <h1 class="title">Apes Bunitori Evolution</h1>
        
        <div class="mint-card">
            <div class="mint-header">
                <span>Items minted</span>
                <span id="mint-count">1,230 / 3,000</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-fill" class="progress-bar-fill"></div>
            </div>

            <div class="stage-box">
                <div class="stage-info">
                    <h3>Public Stage</h3>
                    <div class="price-tag">
                        0.035 ETH
                    </div>
                    <div>
                        <span class="usd-price">$85.64</span>
                        <span class="status-tag"><span class="dot"></span> MINTING NOW</span>
                    </div>
                </div>

                <div class="mint-controls">
                    <div class="qty-selector">
                        <button class="qty-btn" onclick="changeQty(-1)">−</button>
                        <span id="qty-display" class="qty-val">1</span>
                        <button class="qty-btn" onclick="changeQty(1)">+</button>
                    </div>
                    <button class="btn-blue-mint" onclick="mintNFT()">Mint</button>
                </div>
            </div>
            <div id="status-msg"></div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><span>Floor Price</span><strong>0.0025 ETH</strong></div>
            <div class="stat-card"><span>Top Offer</span><strong>0.0001 WETH</strong></div>
            <div class="stat-card"><span>24h Volume</span><strong>0.00 ETH</strong></div>
            <div class="stat-card"><span>Total Volume</span><strong>7.82 ETH</strong></div>
            <div class="stat-card"><span>Listed</span><strong>120 (9.8%)</strong></div>
            <div class="stat-card"><span>Owners</span><strong>132 (10.7%)</strong></div>
        </div>

        <h2 style="font-family: 'Montserrat'; margin-top: 40px; margin-bottom: 20px;">Featured Gallery</h2>
        <div class="gallery">
            <img src="images/evo1.png" alt="NFT Showcase 1" onerror="this.src='images/placeholder1.png'">
            <img src="images/evo2.png" alt="NFT Showcase 2" onerror="this.src='images/placeholder2.png'">
            <img src="images/evo3.png" alt="NFT Showcase 3" onerror="this.src='images/placeholder3.png'">
            <img src="images/evo4.png" alt="NFT Showcase 4" onerror="this.src='images/placeholder4.png'">
        </div>
    </main>

    <script>
        // Adresa ta (trecută prin getAddress pentru a elimina eroarea de checksum)
const RAW_NFT_ADDRESS = "0xc53e2b1E048Cf5F693D370341990c6Ab64a83D6D"; 
const NFT_CONTRACT_ADDRESS = ethers.utils.getAddress(RAW_NFT_ADDRESS.toLowerCase());

const SEADROP_ADDRESS = ethers.utils.getAddress("0x00005ea001867280339de4d165d51d2772023508"); 
const UNIT_PRICE_ETH = "0.035";
        
        let currentQty = 1;

        function changeQty(delta) {
            currentQty += delta;
            if (currentQty < 1) currentQty = 1;
            if (currentQty > 10) currentQty = 10;
            document.getElementById("qty-display").innerText = currentQty;
        }

        const SEADROP_ABI = [
            "function mintPublic(address nftContract, address feeRecipient, address minterIfNotPayer, uint256 quantity) external payable"
        ];

        async function mintNFT() {
            const statusDiv = document.getElementById("status-msg");

            if (typeof window.ethereum === "undefined") {
                statusDiv.innerText = "Te rugăm să instalezi MetaMask!";
                return;
            }

            try {
                statusDiv.innerText = "Se conectează portofelul...";
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                const userAddress = await signer.getAddress();

                const seaDropContract = new ethers.Contract(SEADROP_ADDRESS, SEADROP_ABI, signer);
                statusDiv.innerText = "Confirmă tranzacția în portofel...";
                
                // Calcul dinamic: 0.035 ETH * cantitate
                const totalPrice = ethers.utils.parseEther((0.035 * currentQty).toFixed(4));

                const tx = await seaDropContract.mintPublic(
                    NFT_CONTRACT_ADDRESS,
                    "0x0000000000000000000000000000000000000000",
                    userAddress,
                    currentQty,
                    { value: totalPrice }
                );

                statusDiv.innerText = "Tranzacție trimisă! Se procesează...";
                await tx.wait();
                statusDiv.innerText = "Mint reușit! NFT-urile sunt în portofelul tău.";

            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Eroare: " + (error.reason || error.message);
            }
        }
    </script>
</body>
</html>
