<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apes Bunitori Evolution | BredApeYuriClub Ecosystem</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #080b11; color: #ffffff; min-height: 100vh; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 6%; background: rgba(12,16,26,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.08); }
        .logo { font-family: 'Montserrat', sans-serif; font-weight: 900; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; font-size: 1.5rem; }
        .container { max-width: 1200px; margin: 40px auto; padding: 20px; }
        .title { font-family: 'Montserrat', sans-serif; font-size: 2.8rem; text-align: center; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin: 30px 0; }
        .stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 12px; text-align: center; }
        .stat-card span { display: block; color: #64748b; font-size: 0.8rem; text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
        .stat-card strong { font-size: 1.3rem; color: #f8fafc; font-family: 'Montserrat'; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 40px; }
        .gallery img { width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.3s; }
        .gallery img:hover { transform: scale(1.05); }
        
        /* Stiluri Buton Mint */
        .mint-box { text-align: center; margin: 30px 0; }
        .btn-mint { cursor: pointer; display: inline-block; width: 100%; max-width: 300px; padding: 15px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 1.1rem; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4); transition: opacity 0.2s; }
        .btn-mint:hover { opacity: 0.9; }
        .btn-opensea { display: inline-block; width: 100%; max-width: 300px; margin-top: 15px; padding: 12px; text-align: center; background: rgba(255,255,255,0.05); color: #cbd5e1; text-decoration: none; border-radius: 10px; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); }
        #status-msg { margin-top: 10px; font-size: 0.9rem; color: #a855f7; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">BredApeYuriClub</a>
        <a href="index.html" style="color: #cbd5e1; text-decoration: none; font-weight: 600;">← Back to Collections</a>
    </nav>
    <main class="container">
        <h1 class="title">Apes Bunitori Evolution</h1>
        <div class="stats-grid">
            <div class="stat-card"><span>Floor Price</span><strong>0.25 ETH</strong></div>
            <div class="stat-card"><span>Total Volume</span><strong>7.79 ETH</strong></div>
            <div class="stat-card"><span>Owners</span><strong>131</strong></div>
            <div class="stat-card"><span>Items</span><strong>199</strong></div>
        </div>

        <div class="mint-box">
            <button id="mint-btn" class="btn-mint" onclick="mintNFT()">Mint NFT Direct</button>
            <br>
            <a href="https://opensea.io/collection/apes-bunitori-evolution" target="_blank" class="btn-opensea">View on OpenSea</a>
            <div id="status-msg"></div>
        </div>

        <h2 style="font-family: 'Montserrat'; margin-top: 40px; margin-bottom: 20px;">Featured Gallery</h2>
        <div class="gallery">
            <img src="images/evo1.png" alt="NFT Showcase 1" onerror="this.src='images/placeholder1.png'">
            <img src="images/evo2.png" alt="NFT Showcase 2" onerror="this.src='images/placeholder2.png'">
            <img src="images/evo3.png" alt="NFT Showcase 3" onerror="this.src='images/placeholder3.png'">
            <img src="images/evo4.png" alt="NFT Showcase 4" onerror="this.src='images/placeholder4.png'">
        </div>
    </main>

    <script>
        // CONFIGURARE
        const NFT_CONTRACT_ADDRESS = "CONTRACT_ADDRESS_AICI"; // Pune adresa contractului tău
        const SEADROP_ADDRESS = "0x00005EA001867280339DE4D165d51d2772023508"; // Adresa oficială SeaDrop OpenSea pe Mainnet/Polygon
        
        const SEADROP_ABI = [
            "function mintPublic(address nftContract, address feeRecipient, address minterIfNotPayer, uint256 quantity) external payable"
        ];

        async function mintNFT() {
            const statusDiv = document.getElementById("status-msg");
            
            if (typeof window.ethereum === "undefined") {
                statusDiv.innerText = "Te rugăm să instalezi MetaMask!";
                return;
            }

            try {
                statusDiv.innerText = "Se conectează portofelul...";
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                const userAddress = await signer.getAddress();

                const seaDropContract = new ethers.Contract(SEADROP_ADDRESS, SEADROP_ABI, signer);

                statusDiv.innerText = "Așteaptă confirmarea tranzacției...";
                
                // Pretul per minting (ajustează cu valoarea setată în publicDrop)
                const mintPrice = ethers.utils.parseEther("0.05"); 

                const tx = await seaDropContract.mintPublic(
                    NFT_CONTRACT_ADDRESS,
                    "0x0000000000000000000000000000000000000000", // Fee recipient (implicit 0x0)
                    userAddress, // Primitorul NFT-ului
                    1, // Cantitatea (1 NFT)
                    { value: mintPrice }
                );

                statusDiv.innerText = "Tranzacție trimisă! Se procesează...";
                await tx.wait();
                statusDiv.innerText = "Mint reușit! NFT-ul este în portofelul tău.";

            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Eroare la mintare: " + (error.reason || error.message);
            }
        }
    </script>
</body>
</html>
